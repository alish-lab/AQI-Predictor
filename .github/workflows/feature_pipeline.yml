name: feature-pipeline

# Hourly: fetch the last few days of Open-Meteo data, engineer features, and
# upsert them into the Hopsworks `aqi_features` feature group.
on:
  schedule:
    - cron: "17 * * * *"   # every hour, at :17 (off the top-of-hour rush)
  workflow_dispatch: {}

concurrency:
  group: feature-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run feature pipeline
        run: python -m scripts.run_feature_pipeline
