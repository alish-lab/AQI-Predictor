[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqi_predictor"
version = "0.0.0"
description = "AQI Predictor - feature, training, inference, and dashboard pipelines for air-quality forecasting"
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependencies are pinned in requirements.txt, which is the source of truth.
# Install them with:  pip install -r requirements.txt
dependencies = []

[tool.setuptools.packages.find]
include = ["aqi_predictor*"]
